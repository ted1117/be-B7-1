name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check secrets
        run: |
          test -n "${{ secrets.OCI_HOST }}" && echo "OCI_HOST OK" || echo "OCI_HOST EMPTY"
          test -n "${{ secrets.OCI_SSH_KEY }}" && echo "OCI_SSH_KEY OK" || echo "OCI_SSH_KEY EMPTY"

      - name: Deploy to OCI
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd /home/ubuntu/be-B7-1
            git pull origin main
            /home/ubuntu/.local/bin/uv sync --frozen
            sudo systemctl restart fastapi
