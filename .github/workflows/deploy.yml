name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-oci
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check secrets
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          set -eu
          : "${OCI_HOST:?OCI_HOST secret is required}"
          : "${OCI_USER:?OCI_USER secret is required}"
          : "${OCI_SSH_KEY:?OCI_SSH_KEY secret is required}"

      - name: Deploy to OCI
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -eu
            cd /home/ubuntu/be-B7-1
            git pull --ff-only origin main

            if [ ! -f .env ]; then
              echo "Create .env on the OCI server before deploying." >&2
              exit 1
            fi

            sudo -n docker compose config --quiet
            sudo -n docker compose up -d --build --remove-orphans --wait --wait-timeout 180

            sudo -n docker compose ps
